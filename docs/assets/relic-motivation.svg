<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">

  <!-- Background -->
  <rect width="740" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="370" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">The ALTER_ERROR_BRANCH Problem</text>
  <text x="370" y="48" text-anchor="middle" font-size="11" fill="#57606a">Why structural dependency analysis misses this class of modernization risk</text>

  <!-- ── BEFORE (left) ── -->
  <text x="175" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">BEFORE MODERNIZATION</text>

  <rect x="40" y="94" width="270" height="78" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="60" y="116" font-size="11" font-family="'Courier New', monospace" fill="#1f2328">//STEP02  EXEC PGM=CBACT02C,</text>
  <text x="60" y="134" font-size="11" font-family="'Courier New', monospace" fill="#1f2328">//        COND=(4,GT,STEP01)</text>
  <text x="60" y="155" font-size="10.5" fill="#15803d">→ skip STEP02 if STEP01 returned RC &gt; 4</text>

  <!-- BCG Contract bubble -->
  <rect x="40" y="188" width="270" height="64" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="55" y="207" font-size="10.5" fill="#4c1d95" font-weight="600">BCG Contract (CONTROL_FLOW)</text>
  <text x="55" y="224" font-size="10.5" fill="#6d28d9">STEP02 conditional on STEP01 (RC ≤ 4)</text>
  <text x="55" y="242" font-size="10.5" fill="#6d28d9">static_support = 1.000</text>

  <!-- ── AFTER (right) ── -->
  <text x="565" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">AFTER MODERNIZATION</text>

  <rect x="430" y="94" width="270" height="78" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="450" y="116" font-size="11" font-family="'Courier New', monospace" fill="#1f2328">//STEP02  EXEC PGM=CBACT02C,</text>
  <text x="450" y="134" font-size="11" font-family="'Courier New', monospace" fill="#b91c1c">//        COND=(16,GT,STEP01)</text>
  <text x="450" y="155" font-size="10.5" fill="#b91c1c">→ threshold raised: runs on soft errors too</text>

  <!-- BCG after -->
  <rect x="430" y="188" width="270" height="64" rx="5" fill="#ede9fe" stroke="#f9a8d4" stroke-width="1.8"/>
  <text x="445" y="207" font-size="10.5" fill="#4c1d95" font-weight="600">BCG Contract (CONTROL_FLOW) — modified</text>
  <text x="445" y="224" font-size="10.5" fill="#6d28d9">STEP02 conditional on STEP01 (RC ≤ 16)</text>
  <text x="445" y="242" font-size="10.5" fill="#9d174d" font-weight="600">static_support = 0.700   Δ = −0.300</text>

  <!-- ── Middle arrow ── -->
  <line x1="315" y1="133" x2="425" y2="133" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="370" y="125" text-anchor="middle" font-size="10" fill="#57606a">ALTER_ERROR_BRANCH</text>

  <!-- ── Bottom panels ── -->
  <!-- Structural result -->
  <rect x="40" y="280" width="270" height="58" rx="5" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="175" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Structural Dependency Analysis</text>
  <text x="175" y="319" text-anchor="middle" font-size="11" fill="#374151">STEP02 still follows STEP01</text>
  <text x="175" y="335" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">✗  No risk detected (FN)</text>

  <!-- RELIC result -->
  <rect x="430" y="280" width="270" height="58" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
  <text x="565" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">RELIC / BCGDiff</text>
  <text x="565" y="319" text-anchor="middle" font-size="11" fill="#374151">diff.modified: Δ = 0.30 &gt; threshold</text>
  <text x="565" y="335" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">✓  Risk detected (TP)</text>

  <!-- Same structural dependency note -->
  <text x="175" y="367" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">Same structural graph</text>
  <text x="565" y="367" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">Different behavioral obligation</text>

  <!-- = sign bridge -->
  <text x="370" y="317" text-anchor="middle" font-size="20" fill="#d1d5db">≠</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
  </defs>

</svg>
