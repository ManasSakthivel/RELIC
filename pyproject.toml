[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relic"
version = "1.1.0"
description = "RELIC: behavioral contract analysis for JCL batch modernization, with an independent execution-semantics evaluation"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Manas Sakthivel"}]
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
api = ["fastapi>=0.104", "pydantic>=2.5", "uvicorn>=0.24"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["legacy_contract*", "baselines*", "jcl_oracle*", "relic_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
