experiment_id: E3
research_question: RQ3
hypothesis: H3
description: >
  Dynamic Coverage Analysis — does execution evidence reduce false positives
  compared with static-only analysis, and how does coverage level affect
  contract recovery and validation metrics?
  H3: Precision and F1 increase monotonically as trace coverage increases
  from 0% (static-only) to 100% (full traces), and false-positive rate
  decreases as a function of coverage level.

dataset: datasets/carddemo
ground_truth: benchmark/ground_truth/level2_deterministic.json

independent_variables:
  - coverage_level   # trace subsample fraction: 0.00, 0.10, 0.25, 0.50, 0.75, 1.00

dependent_variables:
  - precision
  - recall
  - f1
  - fpr
  - fnr
  - dynamic_validation_rate
  - n_static_dynamic_conflicts
  - n_not_observed

baselines:
  - static_only    # coverage_level = 0.00 (no traces)

coverage_levels:
  - 0.10
  - 0.25
  - 0.50
  - 0.75
  - 1.00

random_seed: 42

metrics:
  - precision
  - recall
  - f1
  - fpr
  - fnr

statistical_method: bootstrap_ci
bootstrap_n: 10000
significance_threshold: 0.05

contract_types:
  - TEMPORAL
  - RESOURCE
  - CONTROL_FLOW

output_dir: results/rq3

extra:
  # Coverage simulation: subsampling is done by randomly selecting
  # (coverage_level * N_total_traces) traces. Random selection uses random_seed.
  # The same random_seed guarantees identical subsamples across runs.
  trace_source: traces/carddemo/
  trace_source_type: EXECUTION_SIMULATED

  # Key analysis: does increasing coverage reduce FPR?
  # Also measure: at what coverage level do returns become diminishing?
  # This is the "evidence sufficiency" research finding.

  # SCIENTIFIC WARNING: If coverage_level=1.00 traces are from instrumented
  # execution (not real production), label results accordingly in the paper.
  # Do not claim the system was evaluated on production mainframe traces
  # if the traces were generated by GnuCOBOL instrumentation.

  notes: >
    RQ3 tests whether the investment in dynamic evidence is worthwhile.
    If H3 fails (coverage does not improve metrics), this is a potentially
    important negative finding that should be prominently reported.
    Monotonicity is an assumption — report the actual curve, not just
    the endpoint. A non-monotonic result (e.g., medium coverage hurts)
    would be a surprising finding worth investigating.
